include:
  - local: ci/build+test/aio.gitlab-ci.yml
  - local: ci/build+test/cuda.gitlab-ci.yml
  - local: ci/build+test/fedora.gitlab-ci.yml
  - local: ci/build+test/intel.gitlab-ci.yml
  - local: ci/build+test/opensuse15.gitlab-ci.yml
  - local: ci/build+test/rhel8.gitlab-ci.yml
  - local: ci/build+test/rhel9.gitlab-ci.yml
  - local: ci/build+test/rocm.gitlab-ci.yml
  - local: ci/build+test/ubuntu22.04.gitlab-ci.yml
  - local: ci/build+test/ubuntu24.04.gitlab-ci.yml

# Base job for jobs that just compile and output build directories to a later job
.compile:
  stage: build
  interruptible: true
  tags: [MISSING-RUNNER-TAGS]
  dependencies: []
  cache: &compile_caches
    - key: meson-packagecache
      when: always
      paths:
        - subprojects/packagecache/
    - key: ccache-$CI_JOB_NAME
      when: always
      paths:
        - .ccache/
  variables:
    CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
    # These jobs' artifacts and caches are particularly large, take some extra time to
    # compress them down to reasonable levels.
    FF_USE_FASTZIP: "true"
    ARTIFACT_COMPRESSION_LEVEL: slowest
    CACHE_COMPRESSION_LEVEL: slow
  after_script:
    - echo -e "\e[0Ksection_start:`date +%s`:du[collapsed=true]\r\e[0KArtifact on-disk sizes"
    - du -hs subprojects/*/
    - du -hs builddir*/
    - echo -e "\e[0Ksection_end:`date +%s`:du\r\e[0K"
  artifacts:
    when: always
    expire_in: 12 hours
    paths:
      - subprojects/
      - builddir*/
    exclude:
      - subprojects/packagecache/**
      - subprojects/packagefiles/**
      - subprojects/valgrind-headers/**
      - subprojects/hpctesttool-wheels/**
      - subprojects/md5-*/**
      - subprojects/*.wrap
    reports:
      junit: builddir*/meson-logs/testlog.junit.xml

# Base job for jobs that test build directories generated by a previous .compile job
.test:
  needs: [MISSING-SOURCE-JOB]
  stage: test
  interruptible: true
  tags: [MISSING-RUNNER-TAGS]
  cache: *compile_caches
  variables:
    CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
  before_script:
    # Most jobs will test perf_events support at some point. Attempt to enable the
    # support and kernel symbols if we can before continuing the tests.
    - if [ "$(cat /proc/sys/kernel/perf_event_paranoid)" -gt 1 ]; then echo 1 > /proc/sys/kernel/perf_event_paranoid; fi || true
    - if [ "$(cat /proc/sys/kernel/kptr_restrict)" -gt 0 ]; then echo 0 > /proc/sys/kernel/kptr_restrict; fi || true
  artifacts:
    when: always
    reports:
      junit: builddir*/meson-logs/testlog.junit.xml

# Base job for jobs that compile and test in the same job
.compile+test:
  extends: [.test, .needs verify]
  stage: test
  interruptible: true
  cache: *compile_caches
  variables:
    CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
