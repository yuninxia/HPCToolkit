.ubuntu22.04:compile:
  extends: .compile
  script:
    - meson setup builddir/ -Dwerror=true -Ddyninst:werror=false -Dxed:werror=false -Dlibunwind:werror=false
    - cd builddir/
    - meson test --print-errorlogs 'hpctoolkit:*'
    - meson compile

.ubuntu22.04:test cpu:
  extends: .test
  script:
    - cd builddir/
    - meson test --print-errorlogs --repeat 7 'hpctoolkit:*'

ubuntu22.04 amd64:compile:
  extends: .ubuntu22.04:compile
  rules:
    - if: &on_gitlab $CI_SERVER_FQDN == "gitlab.com"
  tags: [$GITLAB_SAAS_LINUX_MAX_AMD64]
  image: &image_amd64
    name: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-ubuntu22.04
    docker:
      platform: linux/amd64

ubuntu22.04 amd64:test cpu:
  extends: .ubuntu22.04:test cpu
  needs: [ubuntu22.04 amd64:compile]
  rules:
    - if: *on_gitlab
  tags: [$GITLAB_SAAS_LINUX_MAX_AMD64]
  image: *image_amd64

ubuntu22.04 arm64:compile:
  extends: .ubuntu22.04:compile
  rules:
    - if: *on_gitlab
  tags: [$GITLAB_SAAS_LINUX_MAX_ARM64]
  image: &image_arm64
    name: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-ubuntu22.04
    docker:
      platform: linux/arm64

ubuntu22.04 arm64:test cpu:
  extends: .ubuntu22.04:test cpu
  needs: [ubuntu22.04 arm64:compile]
  rules:
    - if: *on_gitlab
  tags: [$GITLAB_SAAS_LINUX_MAX_ARM64]
  image: *image_arm64

ubuntu22.04 ppc64le:compile:
  extends: .ubuntu22.04:compile
  rules:
    - if: $HPCTOOLKIT_LINUX_MAX_PPC64LE
  tags: [$HPCTOOLKIT_LINUX_MAX_PPC64LE]
  image: &image_ppc64le
    name: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-ubuntu22.04
    docker:
      platform: linux/ppc64le

ubuntu22.04 ppc64le:compile:hpsf:
  extends: ubuntu22.04 ppc64le:compile
  rules:
    - if: &on_hpsf $CI_SERVER_FQDN == "gitlab.spack.io"
  tags: [hpsf-ppc64le]

ubuntu22.04 ppc64le:test cpu:
  extends: .ubuntu22.04:test cpu
  needs: [ubuntu22.04 ppc64le:compile]
  rules:
    - if: $HPCTOOLKIT_LINUX_MAX_PPC64LE
  tags: [$HPCTOOLKIT_LINUX_MAX_PPC64LE]
  image: *image_ppc64le

ubuntu22.04 ppc64le:test cpu:hpsf:
  extends: ubuntu22.04 ppc64le:test cpu
  needs: [ubuntu22.04 ppc64le:compile:hpsf]
  rules:
    - if: *on_hpsf
  tags: [hpsf-ppc64le]
