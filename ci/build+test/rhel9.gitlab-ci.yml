.rhel9:compile:
  extends: .compile
  script:
    - mkdir tmp/
    # FIXME: This particular combination of PAPI et al. seems to cause hpcrun to hang, always.
    # Disable PAPI in the build until a proper investigation can be carried out.
    - >-
      meson setup tmp/builddir-${BUILD_SLUG}/ -Dwerror=true -Doptimization=2 -Ddebug=false -Db_ndebug=false
      -Dpapi=disabled
    - cd tmp/builddir-${BUILD_SLUG}/
    - meson test --print-errorlogs 'hpctoolkit:*'
    - meson compile

.rhel9:test cpu:
  extends: .test
  script:
    - cd tmp/builddir-${BUILD_SLUG}/
    - meson test --print-errorlogs 'hpctoolkit:*'

.rhel9:compile+test:
  extends: .compile+test
  script:
    # FIXME: This particular combination of PAPI et al. seems to cause hpcrun to hang, always.
    # Disable PAPI in the build until a proper investigation can be carried out.
    - >-
      meson setup tmp/builddir-${BUILD_SLUG}/ -Dwerror=true -Dbuildtype=debugoptimized
      -Dpapi=disabled
    - cd tmp/builddir-${BUILD_SLUG}/
    - meson test --print-errorlogs 'hpctoolkit:*'
    - meson compile

rhel9 amd64:compile:
  extends: .rhel9:compile
  variables:
    BUILD_SLUG: rhel9-amd64
  rules:
    - if: &on_gitlab $CI_SERVER_FQDN == "gitlab.com"
  tags: [$GITLAB_SAAS_LINUX_MAX_AMD64]
  image: &image_amd64
    name: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-rhel9@sha256:df04f89eb8e6c9f02eacdf67f4e31bb7d84be83dde69e28e3949d8a6969efb97
    docker:
      platform: linux/amd64

rhel9 amd64:test cpu:
  extends: .rhel9:test cpu
  variables:
    BUILD_SLUG: rhel9-amd64
  needs: [rhel9 amd64:compile]
  rules:
    - if: *on_gitlab
  tags: [$GITLAB_SAAS_LINUX_MAX_AMD64]
  image: *image_amd64

rhel9 arm64:compile:
  extends: .rhel9:compile
  variables:
    BUILD_SLUG: rhel9-arm64
  rules:
    - if: *on_gitlab
  tags: [$GITLAB_SAAS_LINUX_MAX_ARM64]
  image: &image_arm64
    name: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-rhel9@sha256:df04f89eb8e6c9f02eacdf67f4e31bb7d84be83dde69e28e3949d8a6969efb97
    docker:
      platform: linux/arm64

rhel9 arm64:test cpu:
  extends: .rhel9:test cpu
  variables:
    BUILD_SLUG: rhel9-arm64
  needs: [rhel9 arm64:compile]
  rules:
    - if: *on_gitlab
  tags: [$GITLAB_SAAS_LINUX_MAX_ARM64]
  image: *image_arm64

# NB: Current GPU vendor runtimes don't support ppc64le, so we use a merged compile/test
# architecture for better performance.
rhel9 ppc64le:test:
  extends: .rhel9:compile+test
  variables:
    BUILD_SLUG: rhel9-ppc64le
  rules:
    - if: $HPCTOOLKIT_LINUX_MAX_PPC64LE
  tags: [$HPCTOOLKIT_LINUX_MAX_PPC64LE]
  image:
    name: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-rhel9@sha256:df04f89eb8e6c9f02eacdf67f4e31bb7d84be83dde69e28e3949d8a6969efb97
    docker:
      platform: linux/ppc64le

rhel9 ppc64le:test:hpsf:
  extends: rhel9 ppc64le:test
  variables:
    BUILD_SLUG: rhel9-ppc64le-hpsf
  rules:
    - if: &on_hpsf $CI_SERVER_FQDN == "gitlab.spack.io"
  tags: [hpsf-ppc64le]
