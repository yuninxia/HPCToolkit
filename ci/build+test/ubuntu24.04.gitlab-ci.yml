.ubuntu24.04:compile:
  extends: .compile
  script:
    - meson setup builddir/ -Dwerror=true -Ddyninst:werror=false -Dxed:werror=false
    - cd builddir/
    - meson test --print-errorlogs 'hpctoolkit:*'
    - meson compile

.ubuntu24.04:test cpu:
  extends: .test
  script:
    - cd builddir/
    - meson test --print-errorlogs --repeat 7 'hpctoolkit:*'

ubuntu24.04 amd64:compile:
  extends: .ubuntu24.04:compile
  rules:
    - if: &on_gitlab $CI_SERVER_FQDN == "gitlab.com"
  tags: [$GITLAB_SAAS_LINUX_MAX_AMD64]
  image: &image_amd64
    name: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-ubuntu24.04
    docker:
      platform: linux/amd64

ubuntu24.04 amd64:test cpu:
  extends: .ubuntu24.04:test cpu
  needs: [ubuntu24.04 amd64:compile]
  rules:
    - if: *on_gitlab
  tags: [$GITLAB_SAAS_LINUX_MAX_AMD64]
  image: *image_amd64

ubuntu24.04 arm64:compile:
  extends: .ubuntu24.04:compile
  rules:
    - if: *on_gitlab
  tags: [$GITLAB_SAAS_LINUX_MAX_ARM64]
  image: &image_arm64
    name: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-ubuntu24.04
    docker:
      platform: linux/arm64
  script:
    - meson setup builddir/ -Dwerror=true -Ddyninst:werror=false -Dxed:werror=false
    - cd builddir/
    # FIXME: Dodge undiagnosed bugs in the OpenMP threading and Python support in this image specifically, in CI
    - meson test --print-errorlogs 'hpctoolkit:*' --no-suite hpcrun --no-suite python
    - meson compile

ubuntu24.04 arm64:test cpu:
  extends: .ubuntu24.04:test cpu
  needs: [ubuntu24.04 arm64:compile]
  rules:
    - if: *on_gitlab
  tags: [$GITLAB_SAAS_LINUX_MAX_ARM64]
  image: *image_arm64
  script:
    - cd builddir/
    # FIXME: Dodge undiagnosed bugs in the OpenMP threading and Python support in this image specifically, in CI
    - meson test --print-errorlogs --repeat 7 'hpctoolkit:*' --no-suite hpcrun --no-suite python

ubuntu24.04 ppc64le:compile:
  extends: .ubuntu24.04:compile
  rules:
    - if: $HPCTOOLKIT_LINUX_MAX_PPC64LE
  tags: [$HPCTOOLKIT_LINUX_MAX_PPC64LE]
  image: &image_ppc64le
    name: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-ubuntu24.04
    docker:
      platform: linux/ppc64le

ubuntu24.04 ppc64le:compile:hpsf:
  extends: ubuntu24.04 ppc64le:compile
  rules:
    - if: &on_hpsf $CI_SERVER_FQDN == "gitlab.spack.io"
  tags: [hpsf-ppc64le]

ubuntu24.04 ppc64le:test cpu:
  extends: .ubuntu24.04:test cpu
  needs: [ubuntu24.04 ppc64le:compile]
  rules:
    - if: $HPCTOOLKIT_LINUX_MAX_PPC64LE
  tags: [$HPCTOOLKIT_LINUX_MAX_PPC64LE]
  image: *image_ppc64le
  script:
    - cd builddir/
    # FIXME: For unknown reasons, the Python support doesn't work in this version of Python.
    # Not sure why. Disable it for now. https://gitlab.com/hpctoolkit/hpctoolkit/-/issues/847
    - meson test --print-errorlogs --repeat 7 'hpctoolkit:*' --no-suite python

ubuntu24.04 ppc64le:test cpu:hpsf:
  extends: ubuntu24.04 ppc64le:test cpu
  needs: [ubuntu24.04 ppc64le:compile:hpsf]
  rules:
    - if: *on_hpsf
  tags: [hpsf-ppc64le]
