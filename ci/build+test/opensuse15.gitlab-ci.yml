.opensuse15:compile:
  extends: .compile
  script:
    # FIXME: This particular combination of PAPI et al. seems to cause hpcrun to hang, always.
    # Disable PAPI in the build until a proper investigation can be carried out.
    - >-
      meson setup builddir/ -Dwerror=true -Doptimization=2 -Ddebug=false -Db_ndebug=false
      -Dpapi=disabled
    - cd builddir/
    - meson test --print-errorlogs 'hpctoolkit:*'
    - meson compile

.opensuse15:test cpu:
  extends: .test
  script:
    - cd builddir/
    - meson test --print-errorlogs 'hpctoolkit:*'

opensuse15 amd64:compile:
  extends: .opensuse15:compile
  rules:
    - if: &on_gitlab $CI_SERVER_FQDN == "gitlab.com"
  tags: [$GITLAB_SAAS_LINUX_MAX_AMD64]
  image: &image_amd64
    name: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-leap15@sha256:7788d9a5dd2d0dcf7275c2c6a46884f5fb44d27b98a32cf0b2a56a4756fd33da
    docker:
      platform: linux/amd64

opensuse15 amd64:test cpu:
  extends: .opensuse15:test cpu
  needs: [opensuse15 amd64:compile]
  rules:
    - if: *on_gitlab
  tags: [$GITLAB_SAAS_LINUX_MAX_AMD64]
  image: *image_amd64
