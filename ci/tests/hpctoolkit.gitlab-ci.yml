include:
  - local: /ci/tests/common.gitlab-ci.yml

# Individual test runs, each on a single known software stack
ubuntu22.04 ppc64le:
  extends: .individual test job
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-ubuntu22.04
  tags: [rice-linux-medium-ppc64le]
ubuntu24.04 ppc64le:
  extends: .individual test job
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-ubuntu24.04
  tags: [rice-linux-medium-ppc64le]
  variables:
    # FIXME: For unknown reasons, the Python support doesn't work in this version of Python.
    # Not sure why. Disable it for now. https://gitlab.com/hpctoolkit/hpctoolkit/-/issues/847
    TEST_ARGS: --no-suite python
rhel9 ppc64le:
  extends: .individual test job
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-rhel9
  tags: [rice-linux-medium-ppc64le]
  variables:
    # FIXME: This particular combination of PAPI et al. seems to cause hpcrun to hang, always.
    # Disable PAPI in the build until a proper investigation can be carried out.
    SETUP_ARGS: -Dpapi=disabled

.individual test job cuda:
  extends: .individual test job
  tags: [saas-linux-medium-amd64-gpu-standard]
  variables:
    TEST_ARGS: >-
      --suite opencl
      --suite cuda
      --suite hpcstruct
dev cuda amd64:
  extends: .individual test job cuda
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-aio
  variables:
    # These variables must be set for compatibility with legacy (non-CDI) nvidia-container-toolkit
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  before_script:
    # These paths need to be set for compatibility with nvidia-docker v1
    - export PATH="$PATH":/usr/local/nvidia/bin
    - export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH:}"/usr/local/nvidia/lib:/usr/local/nvidia/lib64
cuda12.0 amd64:
  extends: .individual test job cuda
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-cuda12.0
cuda12.1 amd64:
  extends: .individual test job cuda
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-cuda12.1
cuda12.2 amd64:
  extends: .individual test job cuda
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-cuda12.2
cuda12.4 amd64:
  extends: .individual test job cuda
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-cuda12.4
cuda12.5 amd64:
  extends: .individual test job cuda
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-cuda12.5

