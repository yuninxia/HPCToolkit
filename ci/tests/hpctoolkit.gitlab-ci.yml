include:
  - local: /ci/tests/common.gitlab-ci.yml

# Individual test runs, each on a single known software stack
ubuntu22.04 ppc64le:
  extends: .individual test job
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-ubuntu22.04@sha256:86b36864e3b6ff0893c26df391928854bbc202ddd8f283d727276091dd182e60
  tags: [rice-linux-medium-ppc64le]
ubuntu24.04 ppc64le:
  extends: .individual test job
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-ubuntu24.04@sha256:cbfd9374a67442b42f619da129ae47352383a6e1c6312c0f1e9511984f0f6f6b
  tags: [rice-linux-medium-ppc64le]
  variables:
    # FIXME: For unknown reasons, the Python support doesn't work in this version of Python.
    # Not sure why. Disable it for now. https://gitlab.com/hpctoolkit/hpctoolkit/-/issues/847
    TEST_ARGS: --no-suite python
rhel9 ppc64le:
  extends: .individual test job
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-rhel9@sha256:df04f89eb8e6c9f02eacdf67f4e31bb7d84be83dde69e28e3949d8a6969efb97
  tags: [rice-linux-medium-ppc64le]
  variables:
    # FIXME: This particular combination of PAPI et al. seems to cause hpcrun to hang, always.
    # Disable PAPI in the build until a proper investigation can be carried out.
    SETUP_ARGS: -Dpapi=disabled

.individual test job cuda:
  extends: .individual test job
  tags: [saas-linux-medium-amd64-gpu-standard]
  variables:
    # FIXME: -arch=native is needed in CI to avoid PTX JIT-compilation, without this the
    # CI falls over if the CUDA is too new compared to the driver.
    SETUP_ARGS: -Dcuda_args=-arch=native
    TEST_ARGS: >-
      --suite opencl
      --suite cuda
      --suite hpcstruct
dev cuda amd64:
  extends: .individual test job cuda
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-aio@sha256:aed3071b8690dbdf3e2b4fec2071b47680c0be171e1a5613e43f425b55b67c2c
  variables:
    # These variables must be set for compatibility with legacy (non-CDI) nvidia-container-toolkit
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  before_script:
    # These paths need to be set for compatibility with nvidia-docker v1
    - export PATH="$PATH":/usr/local/nvidia/bin
    - export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH:}"/usr/local/nvidia/lib:/usr/local/nvidia/lib64
