.individual test job cuda:
  extends: .individual test job
  rules:
    - if: $GITLAB_SAAS_LINUX_MAX_AMD64_GPU_STANDARD
  tags: [$GITLAB_SAAS_LINUX_MAX_AMD64_GPU_STANDARD]
  variables:
    # FIXME: -arch=native is needed in CI to avoid PTX JIT-compilation, without this the
    # CI falls over if the CUDA is too new compared to the driver.
    SETUP_ARGS: -Dcuda_args=-arch=native
    TEST_ARGS: >-
      --suite opencl
      --suite cuda
      --suite hpcstruct
dev cuda amd64:
  extends: .individual test job cuda
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-aio@sha256:aed3071b8690dbdf3e2b4fec2071b47680c0be171e1a5613e43f425b55b67c2c
  variables:
    # These variables must be set for compatibility with legacy (non-CDI) nvidia-container-toolkit
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  before_script:
    # These paths need to be set for compatibility with nvidia-docker v1
    - export PATH="$PATH":/usr/local/nvidia/bin
    - export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH:}"/usr/local/nvidia/lib:/usr/local/nvidia/lib64
