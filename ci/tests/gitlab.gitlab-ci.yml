rhel8 amd64:
  extends: .individual test job std
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-rhel8@sha256:7b3173bcdc96237dcb3fdf8074342aadee0c1e79e651d8d3264ed836271c33c9
rhel9 amd64:
  extends: .individual test job std
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-rhel9@sha256:df04f89eb8e6c9f02eacdf67f4e31bb7d84be83dde69e28e3949d8a6969efb97
