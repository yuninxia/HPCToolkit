  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-ubuntu22.04
  variables:
    SETUP_ARGS: --native-file ci/envs/ubuntu22.04.ini
ubuntu22.04 arm64:
  extends: .individual test job std
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-ubuntu22.04
  tags: [saas-linux-small-arm64]
  variables:
    SETUP_ARGS: --native-file ci/envs/ubuntu22.04.ini
ubuntu24.04 amd64:
