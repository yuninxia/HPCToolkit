leap15 amd64:
  extends: .individual test job std
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-leap15
  variables:
    SETUP_ARGS: --native-file ci/envs/leap15.ini
rhel8 amd64:
  extends: .individual test job std
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-rhel8
  variables:
    SETUP_ARGS: --native-file ci/envs/rhel8.ini
rhel9 amd64:
  extends: .individual test job std
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-rhel9
  variables:
    # FIXME: This particular combination of PAPI et al. seems to cause hpcrun to hang, always.
    # Disable PAPI in the build until a proper investigation can be carried out.
    SETUP_ARGS: --native-file ci/envs/rhel9.ini -Dpapi=disabled
rhel9 arm64:
  extends: .individual test job std
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-rhel9
  tags: [saas-linux-small-arm64]
  variables:
    # FIXME: This particular combination of PAPI et al. seems to cause hpcrun to hang, always.
    # Disable PAPI in the build until a proper investigation can be carried out.
    SETUP_ARGS: --native-file ci/envs/rhel9.ini -Dpapi=disabled
fedora39 amd64:
  extends: .individual test job std
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-fedora39
  variables:
