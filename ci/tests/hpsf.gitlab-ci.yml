include:
  - local: /ci/tests/common.gitlab-ci.yml

# Individual test runs, each on a single known software stack
.individual test job ppc64le:
  extends: .individual test job
  tags: [hpsf-ppc64le]
ubuntu22.04 ppc64le:
  extends: .individual test job ppc64le
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-ubuntu22.04@sha256:86b36864e3b6ff0893c26df391928854bbc202ddd8f283d727276091dd182e60
  variables:
    SETUP_ARGS: -Dcuda=disabled
ubuntu24.04 ppc64le:
  extends: .individual test job ppc64le
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-ubuntu24.04@sha256:cbfd9374a67442b42f619da129ae47352383a6e1c6312c0f1e9511984f0f6f6b
  variables:
    SETUP_ARGS: -Dcuda=disabled
rhel9 ppc64le:
  extends: .individual test job ppc64le
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-rhel9@sha256:df04f89eb8e6c9f02eacdf67f4e31bb7d84be83dde69e28e3949d8a6969efb97
  variables:
    # FIXME: This particular combination of PAPI et al. seems to cause hpcrun to hang, always.
    # Disable PAPI in the build until a proper investigation can be carried out.
    SETUP_ARGS: -Dpapi=disabled
    # FIXME: For unknown reasons, the Python support doesn't work in this version of Python.
    # Not sure why. Disable it for now. https://gitlab.com/hpctoolkit/hpctoolkit/-/issues/847
    TEST_ARGS: --no-suite python

.individual test job cuda:
  extends: .individual test job
  tags: [hpsf-gpu, x86_64-nvidiagpu, nvidia-a100]
  variables:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
    TEST_ARGS: >-
      --suite opencl
      --suite cuda
      --suite hpcstruct
