  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-rocm5.5
  <<: *rocm_env
rocm5.6 amd64:
  extends: .individual test job rocm
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-rocm5.6
  <<: *rocm_env
rocm5.7 amd64:
  extends: .individual test job rocm
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-rocm5.7
  <<: *rocm_env
rocm6.0 amd64:
  extends: .individual test job rocm
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-rocm6.0
