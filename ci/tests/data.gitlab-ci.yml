include:
  - local: /ci/tests/common.gitlab-ci.yml

# Selected semi-fresh test runs. These regenerate suitable parts of the test data
# before running the tests, thus testing that "freshening" the test data doesn't
# break any tests. For example, an uncaught change to the output format.
semifresh none cpu:
  extends: .semifresh test job
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-ubuntu20.04@sha256:f427089fb14418968cafa7473c282e0287725ccee8ceca2cd10d506c138a5298
  tags: [saas-linux-medium-amd64]
  variables:
    REGEN_SUITES: none cpu

semifresh nvidia sw-cuda:
  extends: .semifresh test job
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-cuda12.5@sha256:2aa0499fff7f72a0b017f52de8bbc6e3bab8049e842e68fd0c82a48fa24b452f
  tags: [saas-linux-medium-amd64-gpu-standard]
  before_script:
    &cuda_before_script # These paths need to be set for compatibility with nvidia-docker v1
    - export PATH="$PATH":/usr/local/nvidia/bin
    - export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH:}"/usr/local/nvidia/lib:/usr/local/nvidia/lib64
  variables:
    # FIXME: -arch=native is needed in CI to avoid PTX JIT-compilation, without this the
    # CI falls over if the CUDA is too new compared to the driver.
    SETUP_ARGS: -Dcuda_args=-arch=native
    REGEN_SUITES: nvidia sw-cuda

semifresh amd:
  extends: .semifresh test job
  needs: []
  image: registry.gitlab.com/hpctoolkit/rtt-images:1.0.0-aio@sha256:aed3071b8690dbdf3e2b4fec2071b47680c0be171e1a5613e43f425b55b67c2c
  tags: [rice-linux-large-amd64-gpu-amd]
  variables:
    REGEN_SUITES: amd
    # FIXME: The Level Zero-enabled tests FAIL instead of SKIP if the Level Zero driver is unavailable on the
    # system. For now, disable these tests to allow the CI job to pass.
    TEST_ARGS: --no-suite level0

# For easy access, the regenerated test data is made available as a single job artifact archive
fresh testdata:
  stage: artifacts
  image: docker.io/alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
  needs:
    - semifresh none cpu
    - semifresh nvidia sw-cuda
    - semifresh amd
  when: always
  script:
    - apk add git
    - ls -l testdata-patches/
    - git apply --index --check -- testdata-patches/*.patch
  artifacts:
    expose_as: "Test data refresh patches"
    expire_in: 3 days
    paths:
      - testdata-patches/
