# Only spawn workflows for MRs or protected branches
workflow:
  auto_cancel:
    on_job_failure: all
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      auto_cancel:
        on_job_failure: none
        on_new_commit: none
      when: always
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - when: always

stages:
  - verify
  - individual tests
  - semi-fresh tests
  - configuration tests
  - audit
  - pre-deploy checks
  - artifacts

variables:
  # Most jobs require the submodules, those that don't will override this
  GIT_SUBMODULE_STRATEGY: recursive

  # Add a transfer progress bar for artifacts
  TRANSFER_METER_FREQUENCY: 2s

  # Use fastzip to package caches and artifacts
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: default
  CACHE_COMPRESSION_LEVEL: fastest

  # Retry various preliminary job stages (network errors)
  GET_SOURCES_ATTEMPTS: 3
  ARTIFACTS_DOWNLOAD_ATTEMPTS: 3
  EXECUTOR_JOB_SECTION_ATTEMPTS: 3

default:
  retry:
    max: 2
    when:
      - unknown_failure
      - api_failure
      - runner_system_failure
      - runner_unsupported
      - unmet_prerequisites
      - data_integrity_failure
    exit_codes: 68
  hooks:
    pre_get_sources_script:
      - >-
        GIT_TERMINAL_PROMPT=0 git ls-remote --quiet "$CI_REPOSITORY_URL" NONEXTISTENT_REF
        || exit 68

include:
  - local: ci/verify.gitlab-ci.yml
  - local: ci/tests/gitlab.gitlab-ci.yml
    rules: &gitlab_com
      - if: $CI_SERVER_FQDN == "gitlab.com"
  - local: ci/tests/hpctoolkit.gitlab-ci.yml
    rules: &hpctoolkit_gitlab_com
      - if: $CI_SERVER_FQDN == "gitlab.com" && $CI_PROJECT_ID == "38709409"
  - local: ci/tests/hpsf.gitlab-ci.yml
    rules:
      - if: $CI_SERVER_FQDN == "gitlab.spack.io"
  - local: ci/tests/data.gitlab-ci.yml
    rules: *hpctoolkit_gitlab_com
  - local: ci/audit.gitlab-ci.yml
  - local: doc/.gitlab-ci.yml
    rules: *gitlab_com

ci performance report:
  stage: .post
  # Delay this job slightly to allow the data to settle first
  when: delayed
  start_in: 3 minutes
  image:
    name: docker.io/python:3.14.0-alpine@sha256:829edcc737417f9084a154511bde03a50b7996f3746e4c8a6b30a99a9a10648c
    entrypoint: [""]
  dependencies: []
  script:
    - |-
      gitlab_discount=none
      if [ "$CI_SERVER_FQDN" = "gitlab.com" ]; then
        if [ "$CI_PROJECT_ID" = "38709409" ]; then
          gitlab_discount=oss
        else
          gitlab_discount=oss-fork
        fi
      fi
    - >-
      ./ci/perf_report.py
      --gitlab-discount="$gitlab_discount"
      --exclude="$CI_JOB_ID"
      "$CI_SERVER_URL" "$CI_PROJECT_ID" "$CI_PIPELINE_ID"
